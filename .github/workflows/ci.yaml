name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_NO_HOOKS: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Bound compiler memory while loading the generated SDK packages.
      GOFLAGS: ${{ matrix.os == 'macos-15' && '-p=1' || '' }}
      GOMAXPROCS: ${{ matrix.os == 'macos-15' && '2' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - run: go build -trimpath ./cmd/stemma

  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked go golangci-lint actionlint zizmor go:golang.org/x/vuln/cmd/govulncheck
      - run: mise run fmt-check
      - run: mise run tidy-check
      - run: mise run lint
      - run: mise run workflow-lint
      - run: mise run vulncheck
      - run: mise run generate
      - run: git diff --exit-code -- stemma.schema.json
