---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - docs/**
      - .release-please-manifest.json
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      go-version: ${{ steps.versions.outputs.go-version }}
      go-licenses-version: ${{ steps.versions.outputs.go-licenses-version }}
      build-date: ${{ steps.versions.outputs.build-date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false

      - name: Resolve versions
        id: versions
        run: |
          echo "go-version=$(mise config get tools.go)" >> "$GITHUB_OUTPUT"
          echo "go-licenses-version=$(mise tool go:github.com/google/go-licenses/v2 --requested)" >> "$GITHUB_OUTPUT"
          echo "build-date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: versions
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    with:
      build-args: |
        GO_VERSION=${{ needs.versions.outputs.go-version }}
        GO_LICENSES_VERSION=${{ needs.versions.outputs.go-licenses-version }}
        VERSION=${{ github.ref_name }}
        COMMIT=${{ github.sha }}
        DATE=${{ needs.versions.outputs.build-date }}
      cache: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: "true"
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    name: GoReleaser
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write
    env:
      MISE_NO_HOOKS: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          install_args: --locked go go:github.com/google/go-licenses/v2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean --parallelism=2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
