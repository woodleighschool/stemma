---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Docs

on:
  workflow_call:
    inputs:
      upload:
        description: Upload the site for Pages deployment
        type: boolean
        default: false

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: --locked node pnpm oxfmt

      - name: Resolve pnpm store
        id: pnpm
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Configure Pages
        if: ${{ inputs.upload }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build docs site
        run: mise run docs

      - name: Upload artifact
        if: ${{ inputs.upload }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/build
