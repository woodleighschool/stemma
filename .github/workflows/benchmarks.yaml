---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Benchmarks

on:
  push:
    branches:
      - main
    paths: &benchmark-paths
      - internal/**
      - plugin/**
      - go.*
      - .mise/**
      - .github/workflows/benchmarks.yaml
  pull_request:
    branches:
      - main
    paths: *benchmark-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  GOMAXPROCS: "4"
  GOFLAGS: "-p=1 -vet=off"

defaults:
  run:
    shell: bash

jobs:
  benchmarks:
    name: Portable operations
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: --locked go

      - name: Resolve Go benchmark runner
        id: tools
        run: |
          version=$(mise tasks info bench-codspeed --json | jq -er '.tools["github:CodSpeedHQ/codspeed-go"]')
          echo "go-runner-version=$version" >> "$GITHUB_OUTPUT"

      - name: Measure operations
        uses: CodSpeedHQ/action@b1f28b5eccf7cb5bfe6a2a89cb3053eb67f1150c # v5.8.0
        with:
          mode: walltime
          go-runner-version: ${{ steps.tools.outputs.go-runner-version }}
          run: go test -bench=. -benchtime=1s ./internal/archive ./internal/apple ./internal/cas ./internal/diskimage ./internal/pkgbuild ./internal/engine ./internal/intunewin ./internal/intune ./internal/jamf
