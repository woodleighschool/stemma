---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: GoReleaser

on:
  workflow_call:
    inputs:
      snapshot:
        description: Build a snapshot instead of publishing a release
        type: boolean
        required: true

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
          experimental: true
          install_args: --locked go go:github.com/google/go-licenses/v2

      - name: Setup GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Check GoReleaser configuration
        run: goreleaser check

      - name: Run GoReleaser
        run: goreleaser release --clean --parallelism=2 ${{ inputs.snapshot && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
