version: "2"

run:
  timeout: 5m

issues:
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  # Keep correctness checks; avoid duplicate complexity metrics and layout quotas.
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocritic
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - iface
    - ineffassign
    - intrange
    - loggercheck
    - makezero
    - mirror
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - sloglint
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace

  exclusions:
    warn-unused: true
    rules:
      # Tests run native tools and write fixtures; the gosec CLI skips them by default.
      - path: _test\.go$
        linters: [gosec]

  settings:
    # Temporary for now
    gomoddirectives:
      replace-allow-list:
        - charm.land/bubbletea/v2
        - github.com/deploymenttheory/go-apfs-v2
        - github.com/deploymenttheory/go-macos-pkg

    gosec:
      excludes:
        - G304 # User-selected paths are the CLI's file input/output contract.
        - G301 # Published directories and payload metadata need public permissions.
        - G302
        - G306

    embeddedstructfieldcheck:
      forbid-mutex: true

    exhaustive:
      check:
        - switch
        - map

    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false

    godoclint:
      enable:
        - no-unused-link
        - require-stdlib-doclink

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    nolintlint:
      require-explanation: true
      require-specific: true

    # Two-item fixture loops do not need string builders.
    perfsprint:
      strconcat: false
      concat-loop: false
      error-format: false

    reassign:
      patterns:
        - ".*"

    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T"

    sloglint:
      no-global: all
      context: scope

    staticcheck:
      checks:
        - all
        - -ST1000

    thelper:
      test:
        begin: true
        first: false
        name: false
      fuzz:
        begin: true
        first: false
        name: false
      benchmark:
        begin: true
        first: false
        name: false
      tb:
        begin: true
        first: false
        name: false

    usetesting:
      os-temp-dir: true
