version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gocritic
    - modernize
    - nilerr
    - nolintlint
    - revive
    - sloglint
    - unparam
    - usetesting
    - wastedassign
    - whitespace
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T"
    sloglint:
      no-global: all
      context: scope
    usetesting:
      os-temp-dir: true
