version: 2
project_name: stemma
before:
  hooks:
    - go mod tidy -diff
    - go run github.com/google/go-licenses/v2@v2.0.1 save ./cmd/stemma --save_path=.stemma/release-licenses --force
builds:
  - main: ./cmd/stemma
    binary: stemma
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - stemma.schema.json
      - src: .stemma/release-licenses
        dst: licenses
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256
release:
  mode: keep-existing
changelog:
  disable: true
