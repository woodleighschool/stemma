---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: stemma

before:
  hooks:
    - go mod tidy
    - mise run notices

builds:
  - id: stemma
    main: ./cmd/stemma
    binary: stemma
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # The Authenticode dependency has no keyring backend for this target.
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - ids:
      - stemma
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - third_party_licenses/**/*
      - src: "{{ .Env.GOROOT }}/LICENSE"
        dst: third_party_licenses/go
        strip_parent: true

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  mode: keep-existing

changelog:
  disable: true
