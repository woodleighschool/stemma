# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Publish Stemma Plugin
description: Publish GoReleaser plugin bundles as a Stemma OCI plugin

inputs:
  image:
    description: Plugin image reference with the release tag, such as ghcr.io/example/plugin:1.0.0
    required: true
  workdir:
    description: Directory GoReleaser ran in, relative to the workspace
    default: .
  dist:
    description: GoReleaser dist directory, relative to workdir
    default: dist
  stemma-version:
    description: Stemma release that publishes the plugin
    default: 0.10.2 # x-release-please-version

runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        install: false
        cache: false

    - name: Publish plugin
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        DIST: ${{ inputs.dist }}
        IMAGE: ${{ inputs.image }}
        SOURCE: ${{ github.server_url }}/${{ github.repository }}
        STEMMA_VERSION: ${{ inputs.stemma-version }}
      run: >-
        mise exec "github:woodleighschool/stemma@${STEMMA_VERSION}" --
        stemma plugins publish "$IMAGE" --goreleaser "$DIST"
        --annotation "org.opencontainers.image.source=${SOURCE}"
