monorepo_root = true

[tools]
go = "1.27.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.8.0"
golangci-lint = "2.13.2"
lefthook = "2.1.12"
actionlint = "1.7.12"
zizmor = "1.30.1"
oxfmt = "0.67.0"
node = "26.8.2"
pnpm = "12.4.1"
"npm:@commitlint/cli" = "21.2.2"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["docs"]

[tasks.deps]
description = "Install dependencies"
run = "go mod download"

[tasks.build]
description = "Build application"
run = "go build -o stemma ./cmd/stemma"

[tasks.tidy]
description = "Tidy the Go module"
run = "go mod tidy"

[tasks.tidy-check]
description = "Check the Go module is tidy"
run = "go mod tidy -diff"

[tasks.vulncheck]
description = "Scan for known vulnerabilities with govulncheck"
run = "govulncheck ./..."

[tasks.generate]
description = "Generate the published default editor schema"
run = "go run ./cmd/stemma schema --builtins --output-file docs/static/stemma.schema.json"

[tasks.generate-graph]
description = "Regenerate scoped Microsoft Graph clients"
tools = { "github:microsoft/kiota" = "1.35.0" }
run = "go run ./internal/intune/generate.go"

[tasks.test]
description = "Run Go tests"
run = ["go vet ./...", "go test -race -count=1 ./..."]

[tasks.lint-fix]
description = "Run linters and apply fixes"
run = "golangci-lint run --fix"

[tasks.lint]
description = "Run linters"
run = "golangci-lint run"

[tasks.format]
description = "Format Go code"
run = "go fmt ./..."

[tasks.fmt-check]
description = "Check Go formatting"
run = "test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }"

[tasks.clean]
description = "Remove local build outputs"
run = "rm -f stemma stemma.exe coverage.out && rm -rf dist"

[tasks.docs]
description = "Validate and build the documentation site"
run = [
  { task = "//docs:fmt-check" },
  { task = "//docs:lint" },
  { task = "//docs:build" },
]

[tasks.docs-serve]
description = "Preview the documentation with live reload"
run = [{ task = "//docs:dev" }]

[hooks]
postinstall = "lefthook install"
