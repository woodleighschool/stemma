monorepo_root = true

[tools]
go = "1.27.3"
"go:github.com/google/go-licenses/v2" = "v2.0.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
jactionlint = "2.4.0"
oxfmt = "0.75.0"
node = "26.13.0"
pnpm = "12.17.0"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["docs"]

[tasks.deps]
run = "go mod download"

[tasks.build]
run = "go build -o stemma ./cmd/stemma"

[tasks.tidy]
run = "go mod tidy"

[tasks.tidy-check]
run = "go mod tidy -diff"

[tasks.vulncheck]
run = "govulncheck ./..."

[tasks.generate]
description = "Generate the published default editor schema"
run = "go run ./cmd/stemma schema --builtins --output-file docs/static/stemma.schema.json"

[tasks.generate-graph]
description = "Regenerate scoped Microsoft Graph clients"
tools = { "github:microsoft/kiota" = "v1.37.0" }
run = "go run ./internal/intune/generate.go"

[tasks.test]
description = "Vet Go code and run race-enabled tests"
run = ["go vet ./...", "go test -race -count=1 ./..."]

[tasks.bench]
description = "Run portable benchmarks without correctness tests"
env = { GOMAXPROCS = "4", GOFLAGS = "-p=1" }
run = "go test -run='^$' -bench=. -benchtime=1s ./internal/archive ./internal/apple ./internal/cas ./internal/diskimage ./internal/pkgbuild ./internal/engine"

[tasks.bench-codspeed]
description = "Record local CodSpeed measurements without uploading"
tools = { "github:CodSpeedHQ/codspeed-go" = "1.3.0" }
env = { GOMAXPROCS = "4", GOFLAGS = "-p=1", CODSPEED_PROFILE_FOLDER = "{{config_root}}/tmp/codspeed" }
run = [
  'rm -rf "$CODSPEED_PROFILE_FOLDER"',
  "codspeed-go-runner test -bench=. -benchtime=1s ./internal/archive ./internal/apple ./internal/cas ./internal/diskimage ./internal/pkgbuild ./internal/engine",
]

[tasks.lint-fix]
run = "golangci-lint run --fix"

[tasks.lint]
run = "golangci-lint run"

[tasks.format]
run = "go fmt ./..."

[tasks.fmt-check]
run = '''
unformatted=$(gofmt -l .) || exit 1
test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
'''

[tasks.clean]
run = "rm -f stemma stemma.exe coverage.out && rm -rf dist"

[tasks.docs]
description = "Check and build the documentation"
run = [
  { task = "//docs:fmt-check" },
  { task = "//docs:lint" },
  { task = "//docs:build" },
]

[tasks.container-build]
run = 'docker build --build-arg GO_VERSION="$(mise config get tools.go)" --build-arg GO_LICENSES_VERSION="$(mise tool go:github.com/google/go-licenses/v2 --requested)" -t stemma:local .'

[hooks]
postinstall = "lefthook install"
