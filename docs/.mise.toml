[tasks.deps]
run = "pnpm install --frozen-lockfile"

[tasks.dev]
depends = [":deps"]
run = "pnpm run dev"

[tasks.build]
depends = [":deps"]
run = "pnpm run build"

[tasks.serve]
description = "Serve the production build"
depends = [":build"]
run = "pnpm run serve"

[tasks.typecheck]
depends = [":deps"]
run = "pnpm run typecheck"

[tasks.format]
run = "pnpm run format"

[tasks.fmt-check]
run = "oxfmt --check"

[tasks.lint]
description = "Lint and type-check"
depends = [":deps"]
run = "pnpm run lint"

[tasks.lint-fix]
description = "Fix lint issues and type-check"
depends = [":deps"]
run = "pnpm run lint:fix"

[tasks.clean]
description = "Remove build output and Docusaurus caches"
run = "rm -rf build .docusaurus .cache-loader"
